global:
  scrape_interval:     5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: node-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ['${NODE_EXPORTER}']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
  
  - job_name: 'dcgm-exporter'
    metrics_path: /metrics
    static_configs:
      - targets: ['${DCGM_EXPORTER}']